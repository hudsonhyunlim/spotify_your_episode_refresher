name: CI

on:
  push:
    branches: ['**']
  pull_request:

# Unlike the hourly sync, this job installs devDependencies — but it only runs on
# pushes and pull requests, so the install cost is paid rarely.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26'
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run lint

name: Sync Your Episodes

on:
  schedule:
    # Every 4 hours, at :07 past. UTC — GitHub cron has no timezone, so local
    # run times shift by an hour across daylight saving.
    # :07 rather than :00 because GitHub queues scheduled runs at the top of the
    # hour. The schedule is best-effort either way: a missed or dropped run costs
    # nothing, since the next one recomputes the desired state from scratch.
    #
    # Frequency does not affect Spotify's rate limit, which is a rolling 30-second
    # window: each run is the same burst of calls however often it happens. It
    # only changes the daily call total against the Development Mode quota.
    - cron: '7 */4 * * *'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Plan only, change nothing'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: spotify-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Deliberately no `npm ci`: `dependencies` is empty and Node runs the
      # TypeScript directly, so this job stays inside a single billable minute.
      # Adding a runtime dependency or a build step roughly doubles the monthly cost.
      - uses: actions/setup-node@v4
        with:
          node-version: '26'

      - name: Sync
        env:
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
          SPOTIFY_REFRESH_TOKEN: ${{ secrets.SPOTIFY_REFRESH_TOKEN }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '' }}
          # How many episodes to keep in Your Episodes.
          MAX_EPISODES: '50'
          # At most this many from any one show, so daily publishers don't take
          # most of the list and weekly shows still surface. 0 disables the cap.
          MAX_PER_SHOW: '2'
          # Treat an episode this far through as finished, on top of Spotify's own
          # fully_played flag. 90% played stays in the list; 95%+ is pruned.
          # Set to 0 to rely on the flag alone.
          PLAYED_THRESHOLD_PERCENT: '95'
          # Drop an episode whose title already appears in the list. Some
          # publishers push one episode to several feeds.
          DEDUPE_BY_TITLE: '1'
          # Off because it costs one call per tracked episode — about a third of
          # the run's Spotify budget — and the Development Mode quota is the
          # binding limit here. Played state then comes from the show listing,
          # which is occasionally stale, so a finished episode may linger a run.
          VERIFY_RESUME_POINTS: '0'
        run: node src/sync.ts

      - name: Commit state.json
        if: ${{ !inputs.dry_run }}
        run: |
          if git diff --quiet -- state.json; then
            echo "state.json unchanged; nothing to commit."
            exit 0
          fi
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add state.json
          git commit -m "chore: update state.json [skip ci]"
          # A slow run can be overtaken by the next hour's commit; rebase once
          # rather than wedging the schedule until someone intervenes.
          git push || (git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
